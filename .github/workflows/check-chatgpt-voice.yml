name: Check ChatGPT Voice prefixes

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: release
      - name: Compare with OpenAI source
        run: python3 scripts/sync_chatgpt_voice.py --check
