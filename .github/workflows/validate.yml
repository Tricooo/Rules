name: Validate Surge rules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check validator syntax
        run: python3 -m py_compile scripts/validate_rules.py scripts/validate_surge_profile.py
      - name: Test profile contract validator
        run: python3 -m unittest discover -s tests -v
      - name: Validate rule files
        run: python3 scripts/validate_rules.py
